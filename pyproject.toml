[project]
name = "robogaze"
version = "0.1.0"
description = "RoboGaze local VLM inference pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.40",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pydantic>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
serve = [
    "vllm",
]

[project.scripts]
robogaze = "robogaze.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robogaze"]
